[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disttrain"
version = "0.1.0"
description = "GPT pre-training that scales from one GPU to many: DDP, FSDP2, mixed precision, activation checkpointing, sharded checkpoints and MFU accounting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
dependencies = ["torch>=2.6,<3", "numpy>=1.24,<3", "pyyaml>=6.0,<7"]

[project.optional-dependencies]
data = ["datasets>=2.18,<5", "tiktoken>=0.7,<1", "transformers>=4.45,<6"]
dev = ["pytest>=8", "ruff>=0.6", "transformers>=4.45,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905", "SIM105", "SIM108", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
