apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: disttrain-gpt2-xl-fsdp
  namespace: ml-training
  labels:
    app.kubernetes.io/name: disttrain
    app.kubernetes.io/component: training-job
spec:
  nprocPerNode: "4"
  runPolicy:
    cleanPodPolicy: Running
    backoffLimit: 3
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: ghcr.io/kishorhange111/distributed-llm-training:latest
              imagePullPolicy: IfNotPresent
              command:
                - torchrun
                - --nproc_per_node=4
                - --nnodes=2
                - --node_rank=$(RANK)
                - --master_addr=$(MASTER_ADDR)
                - --master_port=$(MASTER_PORT)
                - -m
                - disttrain.train
                - --config
                - configs/gpt2_small_fineweb.yaml
                - --strategy
                - fsdp
                - --out_dir
                - /checkpoints/gpt2-xl-fsdp
              env:
                - name: NCCL_IB_DISABLE
                  value: "0"
                - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
                  value: "1"
              resources:
                requests:
                  cpu: "16"
                  memory: "64Gi"
                  nvidia.com/gpu: "4"
                limits:
                  cpu: "32"
                  memory: "128Gi"
                  nvidia.com/gpu: "4"
              volumeMounts:
                - name: checkpoints
                  mountPath: /checkpoints
                - name: dshm
                  mountPath: /dev/shm
          volumes:
            - name: checkpoints
              persistentVolumeClaim:
                claimName: disttrain-checkpoints-pvc
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 16Gi
    Worker:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: ghcr.io/kishorhange111/distributed-llm-training:latest
              imagePullPolicy: IfNotPresent
              command:
                - torchrun
                - --nproc_per_node=4
                - --nnodes=2
                - --node_rank=$(RANK)
                - --master_addr=$(MASTER_ADDR)
                - --master_port=$(MASTER_PORT)
                - -m
                - disttrain.train
                - --config
                - configs/gpt2_small_fineweb.yaml
                - --strategy
                - fsdp
                - --out_dir
                - /checkpoints/gpt2-xl-fsdp
              resources:
                requests:
                  cpu: "16"
                  memory: "64Gi"
                  nvidia.com/gpu: "4"
                limits:
                  cpu: "32"
                  memory: "128Gi"
                  nvidia.com/gpu: "4"
              volumeMounts:
                - name: checkpoints
                  mountPath: /checkpoints
                - name: dshm
                  mountPath: /dev/shm
          volumes:
            - name: checkpoints
              persistentVolumeClaim:
                claimName: disttrain-checkpoints-pvc
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 16Gi
