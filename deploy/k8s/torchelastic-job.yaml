apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: disttrain-torchelastic-spot
  namespace: ml-training
  labels:
    app.kubernetes.io/name: disttrain
    app.kubernetes.io/component: elastic-training
spec:
  nprocPerNode: "4"
  elasticPolicy:
    rdzvBackend: c10d
    minReplicas: 1
    maxReplicas: 4
    maxRestarts: 10
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 85
  pytorchReplicaSpecs:
    Worker:
      replicas: 2
      restartPolicy: OnFailure
      template:
        spec:
          tolerations:
            - key: "cloud.google.com/gke-preemptible"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"
          containers:
            - name: pytorch
              image: ghcr.io/kishorhange111/distributed-llm-training:latest
              command:
                - torchrun
                - --nproc_per_node=4
                - --rdzv_backend=c10d
                - --rdzv_id=disttrain-elastic
                - -m
                - disttrain.train
                - --config
                - configs/gpt2_small_fineweb.yaml
                - --strategy
                - fsdp
                - --ckpt_interval
                - "50"
                - --out_dir
                - /checkpoints/elastic-run
              resources:
                requests:
                  cpu: "16"
                  memory: "64Gi"
                  nvidia.com/gpu: "4"
                limits:
                  cpu: "32"
                  memory: "128Gi"
                  nvidia.com/gpu: "4"
              volumeMounts:
                - name: checkpoints
                  mountPath: /checkpoints
                - name: dshm
                  mountPath: /dev/shm
          volumes:
            - name: checkpoints
              persistentVolumeClaim:
                claimName: disttrain-checkpoints-pvc
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 16Gi
